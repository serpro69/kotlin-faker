name: KMP production setup

on:
  push:
    branches: [feat/kmp_support]
    paths:
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'core/**'
      - 'faker/**'
      - 'extension/**'
      - 'kotlin-js-store/**'
      - '.github/workflows/kmp-production.yml'
      - '.github/workflows/run_gradle.yml'
      - 'scripts/*kmp*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-production-${{ github.ref }}
  cancel-in-progress: true

# The feature-branch runner uses the same required checks as pull requests.
jobs:
  production:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvm
            os: ubuntu-latest
            task: kmpJvmCheck
          - target: js
            os: ubuntu-latest
            task: kmpJsCheck
          - target: ios
            os: macos-latest
            task: kmpIosCheck
          - target: coverage
            os: ubuntu-latest
            task: kmpCoverageCheck
    name: Production ${{ matrix.target }}
    uses: ./.github/workflows/run_gradle.yml
    with:
      runs-on: ${{ matrix.os }}
      task: ${{ matrix.task }}
      kmp-target: ${{ matrix.target }}
