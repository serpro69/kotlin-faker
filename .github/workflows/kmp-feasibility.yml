name: KMP feasibility

on:
  push:
    branches: [codex/kmp-task1-feasibility]
    paths:
      - 'test/fixtures/kmp-feasibility/**'
      - '.github/workflows/kmp-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jvm-web
            os: ubuntu-latest
            tasks: inventoryInputs jvmTest jsNodeTest jsBrowserTest
            reports: jvmTest jsNodeTest jsBrowserTest
          - name: jvm-min
            os: ubuntu-latest
            tasks: jvmTest -PprobeTestJdk=11
            reports: jvmTest
          - name: compiler-floor
            os: ubuntu-latest
            tasks: jvmTest jsNodeTest jsBrowserTest -PprobeKotlinVersion=2.3.20
            reports: jvmTest jsNodeTest jsBrowserTest
          - name: ios
            os: macos-latest
            tasks: iosSimulatorArm64Test linkDebugTestIosArm64
            reports: iosSimulatorArm64Test
          - name: ios-compiler-floor
            os: macos-latest
            tasks: iosSimulatorArm64Test linkDebugTestIosArm64 -PprobeKotlinVersion=2.3.20
            reports: iosSimulatorArm64Test
    name: Probe ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.name == 'jvm-min'
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select and record Apple environment
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.1.app
          uname -m
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list runtimes
      - name: Run isolated dependency and discovery checks
        run: ./gradlew -p test/fixtures/kmp-feasibility ${{ matrix.tasks }} --console=plain --stacktrace
      - name: Require executed common tests in every requested runtime
        env:
          PROBE_REPORTS: ${{ matrix.reports }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('test/fixtures/kmp-feasibility/build/test-results')
          expected = {
              'jsonTreePreservesUnicodeOrderAndScalarKinds',
              'dateAndInstantApisPreserveLeapDayAndFixedOffset',
              'invalidInputsFailInsteadOfBeingSilentlyAdjusted',
          }
          for task in os.environ['PROBE_REPORTS'].split():
              cases = [case for path in (root / task).glob('TEST-*.xml')
                       for case in ET.parse(path).iter('testcase')]
              names = {case.attrib['name'].split('[')[0].removesuffix('()') for case in cases}
              assert expected <= names, (task, 'missing common tests', names)
              assert all(case.find('skipped') is None and case.find('failure') is None
                         and case.find('error') is None for case in cases), task
              print(task, 'executed', len(cases), 'tests')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmp-feasibility-${{ matrix.name }}
          path: |
            test/fixtures/kmp-feasibility/build/test-results/
            test/fixtures/kmp-feasibility/build/reports/
            test/fixtures/kmp-feasibility/build/inventory/
          if-no-files-found: error
